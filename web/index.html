<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BaseBounty</title>
  <style>
    :root {
      --bg: #0a0e17;
      --card: #121826;
      --border: #1e2a3a;
      --text: #e8eef7;
      --muted: #8b9bb4;
      --accent: #0052ff;
      --accent2: #3b82f6;
      --ok: #22c55e;
      --warn: #f59e0b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: ui-sans-serif, system-ui, sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.45;
    }
    header {
      border-bottom: 1px solid var(--border); padding: 1rem 1.5rem;
      display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap;
    }
    h1 { margin: 0; font-size: 1.25rem; letter-spacing: -0.02em; }
    h1 span { color: var(--accent2); }
    main { max-width: 960px; margin: 0 auto; padding: 1.5rem; display: grid; gap: 1.25rem; }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem;
    }
    .card h2 { margin: 0 0 0.75rem; font-size: 1rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 0.25rem; }
    input, textarea, select {
      width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text);
      border-radius: 8px; padding: 0.6rem 0.75rem; margin-bottom: 0.75rem; font: inherit;
    }
    textarea { min-height: 72px; resize: vertical; }
    button, .btn {
      background: var(--accent); color: #fff; border: none; border-radius: 8px;
      padding: 0.55rem 1rem; font: inherit; font-weight: 600; cursor: pointer;
    }
    button.secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .row { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
    .muted { color: var(--muted); font-size: 0.85rem; }
    .mono { font-family: ui-monospace, monospace; font-size: 0.8rem; word-break: break-all; }
    .status { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 999px; font-size: 0.75rem; background: #1e293b; }
    .status.open { background: #1e3a5f; }
    .status.bid { background: #3b2f1a; color: var(--warn); }
    .status.submitted { background: #1a3b2a; color: var(--ok); }
    .status.released, .status.refunded { background: #2a2a2a; color: var(--muted); }
    #bountyList { display: grid; gap: 0.75rem; }
    .bounty {
      border: 1px solid var(--border); border-radius: 10px; padding: 1rem; background: #0d1320;
    }
    .bounty header { border: none; padding: 0; margin-bottom: 0.5rem; }
    .err { color: #f87171; font-size: 0.9rem; }
    .okmsg { color: var(--ok); font-size: 0.9rem; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    @media (max-width: 640px) { .grid2 { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>Base<span>Bounty</span></h1>
    <div class="row">
      <span class="muted" id="networkLabel">Not connected</span>
      <button type="button" id="connectBtn">Connect wallet</button>
    </div>
  </header>
  <main>
    <div class="card">
      <h2>Config</h2>
      <div class="grid2">
        <div>
          <label>BaseBounty address</label>
          <input id="contractAddr" placeholder="0x..." />
        </div>
        <div>
          <label>USDC address</label>
          <input id="usdcAddr" placeholder="0x..." />
        </div>
      </div>
      <p class="muted">Demo default: Base Sepolia / local Anvil. Post fee 0.10 USDC · settle cut 5%. Save addresses after deploy.</p>
      <div class="row">
        <button type="button" class="secondary" id="saveCfg">Save</button>
        <button type="button" class="secondary" id="refreshBtn">Refresh list</button>
      </div>
      <p id="cfgMsg" class="muted"></p>
    </div>

    <div class="card">
      <h2>Post bounty</h2>
      <label>Title</label>
      <input id="title" placeholder="Audit my Solidity vault" />
      <label>Description</label>
      <textarea id="desc" placeholder="Scope, acceptance criteria, links…"></textarea>
      <div class="grid2">
        <div>
          <label>Escrow (USDC)</label>
          <input id="escrow" type="number" step="0.01" min="0.01" value="10" />
        </div>
        <div>
          <label>Timeout (seconds, 0 = 7d)</label>
          <input id="timeout" type="number" min="0" value="86400" />
        </div>
      </div>
      <div class="row">
        <button type="button" id="approveBtn">Approve USDC</button>
        <button type="button" id="postBtn">Post (fee + escrow)</button>
      </div>
      <p id="postMsg" class="muted"></p>
    </div>

    <div class="card">
      <h2>Open bounties</h2>
      <div id="bountyList"><p class="muted">Connect + set contract address, then refresh.</p></div>
    </div>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
